        function checkMediaType(url) {
            // Kiểm tra xem link có phải là video có thể nhúng không
            if(url.includes('youtube.com/watch?v=')) {
                let vid = url.split('v=')[1].split('&')[0];
                return { type: 'embed', url: `https://www.youtube.com/embed/${vid}?autoplay=0` };
            }
            if(url.includes('vimeo.com/') && !url.includes('player.vimeo.com')) {
                let vid = url.split('vimeo.com/')[1].split('#')[0].split('?')[0];
                return { type: 'embed', url: `https://player.vimeo.com/video/${vid}` };
            }
            // Nếu không phải Youtube/Vimeo, trả về dạng link website (bài viết, trang web chặn iframe)
            return { type: 'external', url: url };
        }

        function saveProgress() {
            localStorage.setItem('nexfit_progress', JSON.stringify(completedVideos));
            if(currentTab === 'dashboard') renderDashboard();
            if(currentTab === 'plan') renderPlanList();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-24');
            setTimeout(() => toast.classList.add('opacity-0', '-translate-y-24'), 2500);
        }

        function navigate(tab) {
            currentTab = tab;
            ['dashboard', 'plan', 'coach'].forEach(t => {
                const dBtn = document.getElementById(`nav-${t}`);
                if(dBtn) {
                    dBtn.className = t === tab 
                        ? 'w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-brand-50 text-brand-500 font-bold transition-all'
                        : 'w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 transition-all font-semibold';
                }
                const mBtn = document.getElementById(`mob-nav-${t}`);
                if(mBtn) {
                    mBtn.className = t === tab
                        ? 'flex flex-col items-center justify-center w-1/3 h-full text-brand-500 gap-1 transition-colors'
                        : 'flex flex-col items-center justify-center w-1/3 h-full text-slate-400 gap-1 transition-colors';
                }
            });

            const container = document.getElementById('view-container');
            
            if (tab === 'dashboard') {
                container.innerHTML = generateDashboardHTML();
                renderDashboard(); 
            } else if (tab === 'plan') {
                container.innerHTML = generateMasterDetailHTML();
                renderPlanList();
                // Tự động load video đầu tiên trên Desktop
                if(window.innerWidth >= 768) selectVideo(allVideos[0].id);
            } else if (tab === 'coach') {
                container.innerHTML = generateCoachHTML();
            }
        }

        function generateMasterDetailHTML() {
            return `
                <div class="flex flex-col md:flex-row h-full w-full bg-slate-50 relative">
                    <!-- Left: List Panel -->
                    <div id="plan-list-panel" class="w-full md:w-[350px] lg:w-[400px] h-full overflow-y-auto hide-scroll bg-white border-r border-slate-200 flex flex-col transition-all duration-300">
                        <div class="p-5 border-b border-slate-100 bg-white sticky top-0 z-10 shadow-sm">
                            <h2 class="text-xl font-black text-slate-900">Lộ trình 30 ngày</h2>
                            <p class="text-xs font-medium text-slate-500 mt-1">Chọn bài tập để xem chi tiết</p>
                        </div>
                        <div id="plan-list-content" class="p-4 space-y-6 pb-20 md:pb-4"></div>
                    </div>
                    
                    <!-- Right: Detail Panel -->
                    <div id="plan-detail-panel" class="w-full flex-1 h-full overflow-y-auto hide-scroll bg-slate-50 absolute md:static top-0 left-0 transform translate-x-full md:translate-x-0 transition-all duration-300 z-20 flex flex-col">
                        <!-- Content injected via JS selectVideo() -->
                        <div class="flex-1 flex items-center justify-center text-slate-400 flex-col gap-4">
                            <i class="fa-solid fa-play-circle text-5xl opacity-20"></i>
                            <p class="font-medium">Chọn một video từ danh sách bên trái</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPlanList() {
            const listContent = document.getElementById('plan-list-content');
            if(!listContent) return;
            
            let html = '';
            for(let d = 1; d <= 30; d++) {
                const dayVideos = allVideos.filter(v => v.day === d);
                if(dayVideos.length === 0) continue;

                html += `
                    <div>
                        <h3 class="text-sm font-black text-slate-900 uppercase tracking-wider mb-3 flex items-center gap-2">
                            Ngày ${d} <span class="flex-1 h-px bg-slate-100 ml-2"></span>
                        </h3>
                        <div class="space-y-3">
                `;

                dayVideos.forEach(v => {
                    const isDone = completedVideos.includes(v.id);
                    const isSelected = v.id === currentVideoId;
                    
                    html += `
                        <div onclick="selectVideo(${v.id})" class="cursor-pointer rounded-2xl p-3 border transition-all duration-200 flex gap-3 items-center
                            ${isSelected ? 'border-brand-500 bg-brand-50 shadow-sm' : 'border-slate-100 bg-white hover:border-brand-200'}">
                            
                            <div class="w-16 h-12 rounded-xl flex items-center justify-center shrink-0 relative overflow-hidden
                                ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}">
                                ${isDone ? '<i class="fa-solid fa-check text-lg"></i>' : `<span class="font-black text-xs">V.${v.id}</span>`}
                            </div>
                            
                            <div class="flex-1 min-w-0">
                                <h4 class="text-sm font-bold text-slate-900 truncate leading-tight mb-1">${v.title}</h4>
                                <p class="text-[10px] text-slate-500 truncate"><i class="fa-solid fa-child-reaching mr-1"></i>${v.muscle}</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            listContent.innerHTML = html;
        }

        function selectVideo(id) {
            currentVideoId = id;
            const video = allVideos.find(v => v.id === id);
            if(!video) return;

            renderPlanList(); // Update selected state in list

            // Slide out logic for mobile
            if(window.innerWidth < 768) {
                document.getElementById('plan-list-panel').classList.add('-translate-x-full');
                document.getElementById('plan-detail-panel').classList.remove('translate-x-full');
            }

            const detailPanel = document.getElementById('plan-detail-panel');
            const mediaData = checkMediaType(video.videoUrl);
            const isDone = completedVideos.includes(id);
            
            // Xử lý giao diện hiển thị Frame: nếu nhúng được thì dùng iframe, nếu không thì hiển thị nút bấm
            let frameHtml = '';
            if (mediaData.type === 'embed') {
                frameHtml = `<iframe src="${mediaData.url}" class="w-full h-full absolute inset-0 z-10" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                frameHtml = `
                    <div class="w-full h-full absolute inset-0 z-10 bg-slate-100 flex flex-col items-center justify-center p-6 text-center border-b border-slate-200">
                        <div class="w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center mb-4 text-slate-300">
                            <i class="fa-solid fa-link text-2xl"></i>
                        </div>
                        <h3 class="text-slate-700 font-bold mb-2">Trang tài liệu tham khảo</h3>
                        <p class="text-sm text-slate-500 mb-5 max-w-xs">Nội dung này nằm trên trang web không hỗ trợ xem trực tiếp. Vui lòng mở trang web gốc để xem.</p>
                        <a href="${mediaData.url}" target="_blank" rel="noopener noreferrer" class="px-6 py-3 bg-brand-500 text-white text-sm font-bold rounded-xl hover:bg-brand-600 transition-all shadow-sm shadow-brand-500/30 flex items-center gap-2">
                            Mở trang web gốc <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
            }

            detailPanel.innerHTML = `
                <!-- Mobile Back Button -->
                <div class="md:hidden bg-white p-4 border-b border-slate-100 flex items-center gap-3 shrink-0 sticky top-0 z-30 shadow-sm">
                    <button onclick="backToList()" class="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition-colors">
                        <i class="fa-solid fa-chevron-left text-sm"></i>
                    </button>
                    <span class="font-bold text-slate-900 truncate flex-1">${video.title}</span>
                </div>

                <!-- Iframe/External Container -->
                <div class="w-full h-[35vh] md:h-[50vh] bg-slate-900 relative shrink-0">
                    ${frameHtml}
                </div>

                <!-- Detail Content -->
                <div class="p-6 md:p-8 bg-white flex-1 relative">
                    <div class="max-w-3xl mx-auto space-y-6">
                        
                        <!-- Header -->
                        <div class="border-b border-slate-100 pb-5">
                            <div class="flex items-center gap-2 text-xs font-bold text-brand-500 uppercase tracking-wider mb-2">
                                <span>Ngày ${video.day}</span> &bull; <span>Video ${video.id}</span>
                            </div>
                            <h2 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight leading-tight">${video.title}</h2>
                        </div>

                        <!-- Info Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100">
                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2"><i class="fa-solid fa-child-reaching text-brand-500"></i> Mục tiêu cơ</h4>
                                <p class="text-sm font-semibold text-slate-800 leading-relaxed">${video.muscle}</p>
                            </div>
                            <div class="bg-brand-50 rounded-2xl p-5 border border-brand-100">
                                <h4 class="text-xs font-bold text-brand-400 uppercase tracking-widest mb-2 flex items-center gap-2"><i class="fa-solid fa-lightbulb text-brand-500"></i> Tip từ HLV</h4>
                                <p class="text-sm font-bold text-brand-800 leading-relaxed italic">"${video.tip}"</p>
                            </div>
                        </div>

                        <!-- Content & Check -->
                        <div class="space-y-4">
                            <div>
                                <h4 class="text-sm font-black text-slate-900 mb-2">Hướng dẫn kỹ thuật</h4>
                                <p class="text-sm font-medium text-slate-600 leading-relaxed bg-slate-50 p-4 rounded-2xl">${video.content}</p>
                            </div>
                            <div class="flex gap-4 items-start bg-orange-50 p-4 rounded-2xl border border-orange-100">
                                <i class="fa-solid fa-triangle-exclamation text-orange-500 mt-1"></i>
                                <div>
                                    <h4 class="text-xs font-bold text-orange-800 uppercase tracking-widest mb-1">Checklist kiểm tra</h4>
                                    <p class="text-sm font-semibold text-orange-900/80">${video.check}</p>
                                </div>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
                                <p class="text-sm font-bold text-slate-700 text-center">${video.cta}</p>
                            </div>
                        </div>

                        <!-- Action Button -->
                        <div class="pt-4 pb-12 md:pb-6">
                            <button onclick="toggleCompleteCurrent()" id="btn-detail-complete" class="w-full py-4 rounded-2xl font-black transition-all duration-300 flex items-center justify-center gap-2 shadow-sm
                                ${isDone ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-brand-500 text-white hover:bg-brand-600 shadow-brand-500/30'}">
                                ${isDone ? '<i class="fa-solid fa-check-circle text-lg"></i> Đã hoàn thành' : 'Đánh dấu hoàn thành'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            // Cuộn phần detail lên đầu mỗi khi chọn bài mới
            detailPanel.scrollTo(0,0);
        }

        function backToList() {
            document.getElementById('plan-list-panel').classList.remove('-translate-x-full');
            document.getElementById('plan-detail-panel').classList.add('translate-x-full');
        }

        function toggleCompleteCurrent() {
            if(!currentVideoId) return;
            const idx = completedVideos.indexOf(currentVideoId);
            if (idx > -1) {
                completedVideos.splice(idx, 1);
                showToast("Đã bỏ đánh dấu");
            } else {
                completedVideos.push(currentVideoId);
                showToast("Đã hoàn thành bài tập!");
            }
            saveProgress();
            // Cập nhật lại màn Detail
            selectVideo(currentVideoId);
        }

        function generateDashboardHTML() {
            const total = allVideos.length;
            const completed = completedVideos.length;
            const percent = Math.round((completed / total) * 100);

            return `
                <div class="p-6 md:p-10 max-w-5xl mx-auto w-full h-full overflow-y-auto pb-24">
                    <h2 class="text-3xl font-black text-slate-900">Tiến độ của bạn</h2>
                    <p class="text-slate-500 font-medium mt-1 mb-8">Theo dõi lộ trình 30 ngày tập luyện.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm flex flex-col items-center">
                            <div class="relative w-40 h-40 flex items-center justify-center mb-4">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="40" fill="transparent" stroke="#f1f5f9" stroke-width="8"/>
                                    <circle cx="50" cy="50" r="40" fill="transparent" stroke="#f24822" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="${251.2 - (percent/100)*251.2}" stroke-linecap="round"/>
                                </svg>
                                <span class="absolute text-3xl font-black text-slate-900">${percent}%</span>
                            </div>
                            <p class="text-sm font-bold text-slate-500 uppercase tracking-widest"><span class="text-brand-500">${completed}</span> / 60 Hoàn thành</p>
                        </div>
                        <div class="space-y-6">
                            <div class="bg-brand-500 rounded-3xl p-6 text-white shadow-lg">
                                <h3 class="text-sm font-bold text-brand-100 uppercase tracking-widest mb-1">Chuỗi ngày liên tục</h3>
                                <div class="text-4xl font-black mt-2"><i class="fa-solid fa-fire mr-2 text-brand-200"></i>4 Ngày</div>
                            </div>
                            <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-lg">
                                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Thời gian tập</h3>
                                <div class="text-4xl font-black mt-2"><i class="fa-solid fa-stopwatch mr-2 text-slate-500"></i>120 Phút</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboard() { /* Layout rendered synchronously above */ }

        function generateCoachHTML() {
            return `
                <div class="p-6 md:p-10 max-w-5xl mx-auto w-full h-full overflow-y-auto pb-24">
                    <h2 class="text-3xl font-black text-slate-900">Góc HLV</h2>
                    <p class="text-slate-500 font-medium mt-1 mb-8">Chuẩn mực chuyên môn & Vận hành Nexfit</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
                            <h3 class="text-lg font-black text-brand-500 mb-4 uppercase tracking-widest"><i class="fa-solid fa-scale-balanced mr-2"></i>Nguyên tắc cốt lõi</h3>
                            <ul class="space-y-4 text-sm font-medium text-slate-600">
                                <li class="flex gap-3"><i class="fa-solid fa-xmark text-red-500 mt-1"></i> Không hứa hẹn cô lập cơ giảm mỡ bụng/đùi.</li>
                                <li class="flex gap-3"><i class="fa-solid fa-check text-emerald-500 mt-1"></i> Nhấn mạnh vai trò phối hợp toàn thân & tim phổi.</li>
                                <li class="flex gap-3"><i class="fa-solid fa-check text-emerald-500 mt-1"></i> Ưu tiên ép bạt, kiểm soát hông/gối thay vì bật cao.</li>
                                <li class="flex gap-3"><i class="fa-solid fa-check text-emerald-500 mt-1"></i> Dừng hoàn toàn trước khi bước xuống bạt.</li>
                            </ul>
                        </div>
                        <div class="bg-slate-50 rounded-3xl p-8 border border-slate-200 shadow-sm">
                            <h3 class="text-lg font-black text-slate-700 mb-4 uppercase tracking-widest"><i class="fa-solid fa-clipboard-check mr-2"></i>Checklist Vận Hành</h3>
                            <ul class="space-y-4 text-sm font-medium text-slate-600">
                                <li class="flex gap-3"><i class="fa-regular fa-circle-check text-slate-400 mt-1"></i> Bạt khô, máy phẳng, chân chống chắc chắn.</li>
                                <li class="flex gap-3"><i class="fa-regular fa-circle-check text-slate-400 mt-1"></i> Đảm bảo khoảng trống an toàn mỗi người/máy.</li>
                                <li class="flex gap-3"><i class="fa-regular fa-circle-check text-slate-400 mt-1"></i> Không nhào lộn trên mini-trampoline.</li>
                                <li class="flex gap-3"><i class="fa-regular fa-circle-check text-slate-400 mt-1"></i> Sàng lọc sức khỏe hội viên trước buổi tập.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            navigate('plan');
        }
    </script>
</body>
</html>
