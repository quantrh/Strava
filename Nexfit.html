<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexfit - Trampoline Fitness App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        // Nexfit Orange-Red Palette based on the provided logo
                        brand: {
                            50: '#fff0eb',
                            100: '#ffdcd1',
                            200: '#ffbfae',
                            300: '#ff997e',
                            400: '#ff6943',
                            500: '#ff4d1b', // Primary Nexfit Orange-Red
                            600: '#eb380b',
                            700: '#c32707',
                            800: '#9b200b',
                            900: '#7e1e0d',
                        },
                        accent: {
                            500: '#475569', // Slate 600 as a strong secondary/contrast
                            600: '#334155', // Slate 700
                        },
                        surface: {
                            bg: '#f8fafc',    // Slate 50
                            card: '#ffffff',  // White
                            border: '#e2e8f0' // Slate 200
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Progress Circle */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.8s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        /* Mobile safe area padding */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-surface-bg text-slate-800 font-sans h-screen flex overflow-hidden antialiased selection:bg-brand-500 selection:text-white">

    <!-- Sidebar (Desktop) -->
    <aside class="hidden md:flex flex-col w-72 bg-surface-card border-r border-surface-border h-full z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)] relative">
        <div class="p-6 flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-600 flex items-center justify-center shadow-lg shadow-brand-500/30 text-white">
                <i class="fa-solid fa-bolt text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">NEXFIT<span class="text-brand-500">.</span></h1>
                <p class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Fit Your Life</p>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-3 mt-2">
            <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-left transition-all duration-300 bg-brand-50 text-brand-600 font-bold shadow-sm">
                <i class="fa-solid fa-chart-pie w-5 text-center text-lg"></i>
                <span>Tổng quan</span>
            </button>
            <button onclick="navigate('plan')" id="nav-plan" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-left transition-all duration-300 text-slate-500 hover:text-slate-800 hover:bg-slate-50 font-semibold border border-transparent">
                <i class="fa-solid fa-play-circle w-5 text-center text-lg"></i>
                <span>Lộ trình 30 ngày</span>
            </button>
            <button onclick="navigate('coach')" id="nav-coach" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-left transition-all duration-300 text-slate-500 hover:text-slate-800 hover:bg-slate-50 font-semibold border border-transparent">
                <i class="fa-solid fa-chalkboard-user w-5 text-center text-lg"></i>
                <span>Góc Huấn Luyện Viên</span>
            </button>
        </nav>

        <div class="p-6 border-t border-surface-border bg-slate-50/50">
            <div class="flex items-center gap-4">
                <img src="https://placehold.co/100x100/ff4d1b/ffffff?text=HN" class="w-12 h-12 rounded-full border-2 border-white shadow-md" alt="Avatar">
                <div>
                    <p class="text-sm font-extrabold text-slate-900">Hương Nguyễn</p>
                    <p class="text-xs text-brand-500 font-semibold">Master Trainer</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto hide-scroll relative pb-24 md:pb-0 scroll-smooth">
        
        <!-- Header (Mobile) -->
        <header class="md:hidden sticky top-0 bg-white/90 backdrop-blur-lg z-30 border-b border-surface-border p-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-600 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-bolt text-sm"></i>
                </div>
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">NEXFIT</h1>
            </div>
            <img src="https://placehold.co/100x100/ff4d1b/ffffff?text=HN" class="w-9 h-9 rounded-full shadow-sm border border-slate-200" alt="Avatar">
        </header>

        <div class="p-4 md:p-8 max-w-5xl mx-auto w-full fade-in min-h-full" id="content-area">
            <!-- Content gets injected here by JS -->
        </div>
    </main>

    <!-- Bottom Nav (Mobile) -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-surface-border z-30 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
        <div class="flex justify-around items-center p-2 h-16">
            <button onclick="navigate('dashboard')" id="mob-nav-dashboard" class="flex flex-col items-center justify-center gap-1 w-1/3 h-full text-brand-500 transition-colors relative">
                <div class="absolute top-0 w-8 h-1 bg-brand-500 rounded-b-full"></div>
                <i class="fa-solid fa-chart-pie text-xl"></i>
                <span class="text-[10px] font-bold">Tổng quan</span>
            </button>
            <button onclick="navigate('plan')" id="mob-nav-plan" class="flex flex-col items-center justify-center gap-1 w-1/3 h-full text-slate-400 hover:text-slate-800 transition-colors relative">
                <div class="absolute top-0 w-8 h-1 bg-transparent rounded-b-full transition-colors hidden" id="mob-nav-plan-indicator"></div>
                <i class="fa-solid fa-play-circle text-xl"></i>
                <span class="text-[10px] font-bold">Lộ trình</span>
            </button>
            <button onclick="navigate('coach')" id="mob-nav-coach" class="flex flex-col items-center justify-center gap-1 w-1/3 h-full text-slate-400 hover:text-slate-800 transition-colors relative">
                <div class="absolute top-0 w-8 h-1 bg-transparent rounded-b-full transition-colors hidden" id="mob-nav-coach-indicator"></div>
                <i class="fa-solid fa-chalkboard-user text-xl"></i>
                <span class="text-[10px] font-bold">HLV</span>
            </button>
        </div>
    </nav>

    <!-- Video Player Modal -->
    <div id="video-modal" class="fixed inset-0 z-50 hidden opacity-0 transition-all duration-300">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <!-- Modal Content (Responsive scaling) -->
        <div class="absolute bottom-0 w-full h-[90vh] md:h-auto md:max-h-[90vh] md:inset-x-4 md:top-1/2 md:-translate-y-1/2 xl:w-[900px] xl:mx-auto bg-white md:rounded-3xl rounded-t-3xl shadow-2xl flex flex-col transform translate-y-full md:translate-y-0 md:scale-95 transition-all duration-300 overflow-hidden border border-slate-200" id="modal-inner">
            
            <!-- Handle for mobile drag (visual only) -->
            <div class="w-full flex justify-center py-3 md:hidden" onclick="closeModal()">
                <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
            </div>

            <!-- Video Player Wrapper (16:9 Aspect Ratio) -->
            <div class="relative w-full aspect-video bg-black shrink-0 relative group">
                <!-- Close Button (Desktop) -->
                <button onclick="closeModal()" class="hidden md:flex absolute -top-4 -right-4 z-20 w-10 h-10 rounded-full bg-white text-slate-800 items-center justify-center shadow-lg hover:scale-110 transition-transform">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                
                <!-- Real iframe Player -->
                <iframe id="modal-video-frame" class="w-full h-full" src="" title="Video Player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>

            <!-- Scrollable Video Info -->
            <div class="flex-1 overflow-y-auto hide-scroll bg-surface-bg p-5 md:p-8">
                <!-- Badges & Title -->
                <div class="mb-6">
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <span id="modal-day" class="px-3 py-1.5 bg-brand-100 text-brand-600 font-extrabold text-xs rounded-lg uppercase tracking-wider">Ngày 1</span>
                        <span id="modal-vid-num" class="px-3 py-1.5 bg-slate-200 text-slate-700 font-bold text-xs rounded-lg">Video 01</span>
                    </div>
                    <h2 id="modal-title" class="text-2xl md:text-3xl font-black text-slate-900 leading-tight">Title Here</h2>
                </div>

                <!-- Structured Content Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                    
                    <!-- Left Column -->
                    <div class="space-y-4 md:space-y-6">
                        <!-- Mục tiêu (Cơ chính) -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-16 h-16 bg-brand-50 rounded-bl-full -z-0"></div>
                            <h4 class="font-bold text-slate-500 text-xs uppercase tracking-wider mb-2 relative z-10 flex items-center gap-2">
                                <i class="fa-solid fa-child-reaching text-brand-500"></i> Mục tiêu cơ chính
                            </h4>
                            <p id="modal-muscle" class="font-bold text-slate-800 text-sm relative z-10"></p>
                        </div>

                        <!-- Tip -->
                        <div class="bg-gradient-to-r from-brand-50 to-white rounded-2xl p-5 shadow-sm border border-brand-100 border-l-4 border-l-brand-500">
                            <h4 class="font-bold text-slate-500 text-xs uppercase tracking-wider mb-2 flex items-center gap-2">
                                <i class="fa-solid fa-lightbulb text-brand-500"></i> Tip
                            </h4>
                            <p id="modal-tip" class="font-medium text-slate-800 italic text-sm md:text-base leading-relaxed"></p>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="space-y-4 md:space-y-6">
                        <!-- Hướng dẫn (Content) -->
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 h-full">
                            <h4 class="font-bold text-slate-500 text-xs uppercase tracking-wider mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-person-chalkboard text-accent-500"></i> Hướng dẫn kỹ thuật
                            </h4>
                            <p id="modal-content" class="text-slate-600 text-sm leading-relaxed whitespace-pre-line"></p>
                        </div>
                    </div>
                </div>

                <!-- CTA & Checklist -->
                <div class="mt-4 md:mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-orange-50 rounded-2xl p-4 md:p-5 border border-orange-100 flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-orange-200 text-orange-600 flex items-center justify-center shrink-0 mt-0.5">
                            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-orange-800 text-xs uppercase tracking-wider mb-1">Checklist Kiểm Tra</h4>
                            <p id="modal-check" class="text-sm font-medium text-orange-900/80"></p>
                        </div>
                    </div>

                    <div class="bg-blue-50 rounded-2xl p-4 md:p-5 border border-blue-100 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-200 text-blue-600 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-bullseye text-sm"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-blue-800 text-xs uppercase tracking-wider mb-1">Hành động (CTA)</h4>
                            <p id="modal-cta" class="text-sm font-bold text-blue-900"></p>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Footer Action -->
            <div class="p-4 bg-white border-t border-slate-100 shrink-0">
                <button onclick="toggleCompleteCurrent()" id="btn-complete" class="w-full py-4 rounded-2xl font-bold text-white transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:scale-[1.02] active:scale-[0.98]">
                    <!-- Configured via JS -->
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 transform -translate-y-20 opacity-0 transition-all duration-300 z-[100]">
        <i id="toast-icon" class="fa-solid fa-circle-check text-accent-400"></i>
        <span id="toast-msg" class="font-semibold text-sm">Thành công!</span>
    </div>

    <script>
        // --- 1. DATA DEFINITION (Full Playbook Content) ---
        // Video YouTube có thể phát thật để minh họa (hỗ trợ fullscreen tự động từ iframe)
        const placeholderVideo = "https://www.youtube.com/embed/jfKfPfyJRdk?rel=0"; 

        const allVideos = [
            // Ngày 1
            { id: 1, day: 1, title: 'Health Bounce: Bài nhập môn', cover: 'NGƯỜI MỚI - HEALTH BOUNCE', muscle: 'Bắp chân, đùi trước, cơ mông; core giữ thân.', tip: '"Mới tập Trampoline? Đừng vội nhảy cao."', content: 'Đặt chân rộng bằng hông, gối mềm. Ép nhẹ hai chân xuống bạt nhưng bàn chân gần như không rời mặt bạt. Giữ mắt nhìn thẳng và người ở giữa. Thực hiện 3 nhịp chậm rồi 4 nhịp đều.', check: 'Không cố bật cao; dừng hoàn toàn trước khi bước xuống.', cta: 'Lưu video này làm bài nhập môn trước buổi đầu.', videoUrl: placeholderVideo },
            { id: 2, day: 1, title: 'Tư thế nền của mọi động tác', cover: 'TƯ THẾ NỀN - 4 ĐIỂM', muscle: 'Chuỗi chân-hông và core ổn định.', tip: '"Tư thế này quyết định gần như cả buổi tập."', content: 'Chân rộng bằng hông, gối mềm, hông lùi nhẹ, ngực mở vừa phải. Không ưỡn lưng và không khóa gối. Lưu ý giữ đường thẳng tai-vai-hông và vòng tròn ở trục gối-mũi chân.', check: 'Cột sống trung lập; vai thả; mắt nhìn trước.', cta: 'Bạn muốn Hương kiểm tra tư thế? Nhắn OFFLINE kèm khu vực.', videoUrl: placeholderVideo },
            // Ngày 2
            { id: 3, day: 2, title: 'Press Down, không Jump Up', cover: 'ÉP XUỐNG, KHÔNG BẬT CAO', muscle: 'Đùi trước, cơ mông, bắp chân; core chống rung lắc.', tip: '"Nhảy càng cao chưa chắc tập càng đúng."', content: 'Trong fitness trampoline, ưu tiên ép bạt và giữ đầu ổn định. Biên độ thấp giúp kiểm soát nhịp, hông và gối tốt hơn.', check: 'Sử dụng biên độ thấp, tập trung lực ép bạt.', cta: 'HLV/chủ phòng muốn nhận checklist kỹ thuật? Nhắn MỞ PHÒNG.', videoUrl: placeholderVideo },
            { id: 4, day: 2, title: 'Cách dừng nảy an toàn', cover: 'DỪNG NẢY - 3 BƯỚC', muscle: 'Đùi trước, đùi sau và core giảm chuyển động.', tip: '"Biết nhảy chưa đủ; phải biết dừng."', content: 'Giảm dần biên độ nảy. Mở chân vững, gập gối nhẹ khi chân chạm bạt. Dừng hoàn toàn, lấy lại thăng bằng rồi mới bước xuống. Không nhảy trực tiếp từ bạt xuống sàn.', check: 'Dừng hoàn toàn trên bạt trước khi bước xuống sàn.', cta: 'Lưu video; đây là kỹ năng phải học trước khi vào nhạc nhanh.', videoUrl: placeholderVideo },
            // Ngày 3
            { id: 5, day: 3, title: 'Vì sao phải ở giữa bạt?', cover: 'GIỮ TÂM BẠT', muscle: 'Cơ ổn định cổ chân, cơ mông bên và core.', tip: '"Bạn cứ trôi ra mép bạt vì thiếu điểm này."', content: 'Nhìn một điểm cố định phía trước, giảm độ cao và ép hai chân cân bằng nhau. Nếu vẫn bị trôi, hãy trở về bài Health Bounce thay vì cố tăng tốc độ.', check: 'Mắt nhìn một điểm cố định; cảm nhận lực bám 2 chân cân nhau.', cta: 'Bình luận TÂM nếu bạn muốn nhận video bài tập giữ thăng bằng.', videoUrl: placeholderVideo },
            { id: 6, day: 3, title: 'Gối đi cùng hướng mũi chân', cover: 'TRỤC GỐI - ĐÚNG/SAI', muscle: 'Đùi trước, cơ mông bên, cơ khép và ổn định bàn chân.', tip: '"Gối đổ vào trong? Hạ nhịp ngay lập tức."', content: 'Đặt toàn bàn chân vững chắc, để gối hướng theo mũi chân. Giảm biên độ và giữ hông cân. Chất lượng trục chân quan trọng hơn việc chạy theo tốc độ nhạc.', check: 'Bàn chân bám đều; hông cân; trục gối mở theo mũi chân.', cta: 'Nhắn ONLINE nếu bạn cần HLV quan sát tư thế từ xa.', videoUrl: placeholderVideo },
            // Ngày 4
            { id: 7, day: 4, title: 'March cho cơ gập hông', cover: 'CƠ GẬP HÔNG - MARCH', muscle: 'Cơ gập hông, cẳng chân trước; core giữ thân.', tip: '"Muốn nâng gối mà người không ngả ra sau?"', content: 'Bắt đầu bằng March: ép một chân xuống, nâng chân kia lên vừa đủ; đổi bên đều đặn. Giữ xương sườn trên hông, tuyệt đối không hất người ra sau.', check: 'Xương sườn ở trên hông; thân trên không ngả/hất ra sau.', cta: 'Thử 8 nhịp mỗi bên và bình luận bên nào khó thực hiện hơn.', videoUrl: placeholderVideo },
            { id: 8, day: 4, title: 'Basic Bounce đúng kỹ thuật', cover: 'BASIC BOUNCE - 3 CUES', muscle: 'Bắp chân, đùi trước, cơ mông; core.', tip: '"Basic Bounce không phải cứ nhún lên xuống tùy ý."', content: 'Giữ đầu tương đối ổn định không nảy lên xuống quá mạnh. Hông và gối gập nhẹ, ép chân bạt xuống rồi trở về vị trí giữa. Bắt đầu nhịp chậm, chỉ tăng tốc khi không bị trôi tâm.', check: 'Đầu tương đối ổn định; chỉ tăng nhịp sau khi giữ được tâm.', cta: 'Nhắn TẬP THỬ để nhận lịch lớp dành cho người mới.', videoUrl: placeholderVideo },
            // Ngày 5
            { id: 9, day: 5, title: 'Một động tác, ba cấp độ', cover: '1 ĐỘNG TÁC - 3 CẤP ĐỘ', muscle: 'Toàn bộ chuỗi chân-hông; hệ tim phổi tăng theo cấp.', tip: '"Người mới không cần theo cùng biên độ với HLV."', content: 'Luôn chọn mức độ mà bạn còn kiểm soát được tư thế và nhịp thở. Cấp 1: Chân không rời mặt bạt. Cấp 2: Basic Bounce nảy thấp. Cấp 3: Tăng nhịp nhưng vẫn giữ chặt tâm bạt.', check: 'Dù ở cấp độ nào vẫn phải giữ cùng trục gối, tâm bạt và nhịp thở.', cta: 'Nhắn ONLINE kèm kinh nghiệm tập để được xếp cấp độ.', videoUrl: placeholderVideo },
            { id: 10, day: 5, title: 'Checklist 15 giây trước khi tập', cover: '5 ĐIỂM KIỂM TRA THIẾT BỊ', muscle: 'An toàn vận động; bảo vệ khả năng thực hiện.', tip: '"HLV chuyên nghiệp kiểm tra gì trước khi bật nhạc?"', content: 'Đảm bảo: 1. Chân máy tiếp đất bằng phẳng. 2. Bungee/dây thừng còn căng tốt. 3. Mặt bạt khô ráo. 4. Không gian xung quanh dọn dẹp trống trải. 5. Tay vịn chắc chắn.', check: 'Máy phẳng, khô; một người/máy; kiểm tra theo nhà sản xuất.', cta: 'Muốn xem bộ tiêu chuẩn vận hành lớp? Nhắn MỞ PHÒNG.', videoUrl: placeholderVideo },
            // Ngày 6

        // --- 2. STATE MANAGEMENT & LOCAL STORAGE ---
        let state = {
            completedVideos: [], 
            currentView: 'dashboard',
            activeVideoId: null
        };

        const STORAGE_KEY = 'nexfit_app_v2';

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if(saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.completedVideos = parsed.completedVideos || [];
                } catch(e) { console.error("Error loading state", e); }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                completedVideos: state.completedVideos
            }));
            // Update UI optionally without full re-render
        }

        // --- 3. UI RENDERING LOGIC ---
        
        function navigate(view) {
            state.currentView = view;
            const container = document.getElementById('content-area');
            
            // Update Desktop Nav
            ['dashboard', 'plan', 'coach'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if(v === view) {
                    btn.className = 'nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-left transition-all duration-300 bg-brand-50 text-brand-600 font-bold shadow-sm';
                } else {
                    btn.className = 'nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl text-left transition-all duration-300 text-slate-500 hover:text-slate-800 hover:bg-slate-50 font-semibold border border-transparent';
                }
            });

            // Update Mobile Nav
            ['dashboard', 'plan', 'coach'].forEach(v => {
                const mobBtn = document.getElementById(`mob-nav-${v}`);
                const indicator = document.getElementById(`mob-nav-${v}-indicator`);
                if(v === view) {
                    mobBtn.classList.replace('text-slate-400', 'text-brand-500');
                    mobBtn.classList.replace('hover:text-slate-800', 'text-brand-500');
                    if(indicator) { indicator.classList.remove('hidden'); indicator.classList.add('bg-brand-500'); }
                    else { mobBtn.querySelector('div').className = 'absolute top-0 w-8 h-1 bg-brand-500 rounded-b-full'; }
                } else {
                    mobBtn.classList.replace('text-brand-500', 'text-slate-400');
                    mobBtn.classList.add('hover:text-slate-800');
                    if(indicator) { indicator.classList.add('hidden'); indicator.classList.remove('bg-brand-500'); }
                    else { mobBtn.querySelector('div').className = 'absolute top-0 w-8 h-1 bg-transparent rounded-b-full hidden'; }
                }
            });

            // Render Content
            container.classList.remove('fade-in');
            void container.offsetWidth; // Trigger reflow
            
            if(view === 'dashboard') {
                container.innerHTML = renderDashboard();
                setTimeout(animateDashboard, 100);
            } else if (view === 'plan') {
                container.innerHTML = renderTrainingPlan();
            } else if (view === 'coach') {
                container.innerHTML = renderCoachCorner();
            }
            
            container.classList.add('fade-in');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- STREAMING_CHUNK:Rendering Dashboard... ---
        function renderDashboard() {

            const completed = state.completedVideos.length;
            const percent = Math.round((completed / total) * 100);
            const radius = 60;
            const circumference = 2 * Math.PI * radius;
            const currentDay = Math.min(30, Math.floor(completed / 2) + 1);

                        <!-- BG decor -->
                        <div class="absolute top-0 right-0 p-10 opacity-10 pointer-events-none">
                            <i class="fa-solid fa-bolt text-[150px]"></i>
                        </div>

                        <div class="relative w-40 h-40 shrink-0 z-10 bg-white/10 rounded-full p-2 backdrop-blur-sm">

                            </svg>

                        <!-- Stats text -->
                        <div class="text-center md:text-left z-10 flex-1">

                            <div class="flex flex-wrap gap-4 justify-center md:justify-start">
                                <div class="bg-white text-slate-800 px-5 py-3 rounded-2xl flex items-center gap-4 shadow-lg">
                                    <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-brand-600"><i class="fa-solid fa-fire text-lg"></i></div>

                                    Tập Tiếp <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Highlight Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100">
                            <div class="w-12 h-12 rounded-2xl bg-orange-100 text-orange-500 flex items-center justify-center text-xl mb-4">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <h3 class="font-bold text-slate-900 text-lg mb-3">Nguyên tắc cốt lõi</h3>
                            <ul class="space-y-3 text-sm text-slate-600 font-medium">

        // --- STREAMING_CHUNK:Rendering Plan & Coach Corner... ---
        function renderTrainingPlan() {
            let html = `
                <div class="mb-8 md:mb-10">
                    <h2 class="text-3xl md:text-4xl font-black text-slate-900 mb-3 tracking-tight">Lộ trình 30 Ngày</h2>
                    <p class="text-slate-500 font-medium text-lg">60 Video Kỹ Thuật & Bài Tập - Chuẩn Nexfit Playbook</p>
                </div>
                <div class="space-y-6 md:space-y-8">
            `;

            for(let d = 1; d <= 30; d++) {
                const dayVideos = allVideos.filter(v => v.day === d);
                if(dayVideos.length === 0) continue;

                const isDayComplete = dayVideos.every(v => state.completedVideos.includes(v.id));
                const dayBadge = isDayComplete 
                    ? `<span class="bg-brand-100 text-brand-600 text-[10px] px-3 py-1 rounded-lg font-bold uppercase tracking-widest flex items-center gap-1"><i class="fa-solid fa-check-double"></i> Hoàn thành</span>` 
                    : `<span class="bg-slate-100 text-slate-500 text-[10px] px-3 py-1 rounded-lg font-bold uppercase tracking-widest">2 Video</span>`;

                html += `
                    <div class="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                        <div class="px-5 md:px-8 py-5 flex justify-between items-center border-b border-slate-50 bg-slate-50/50">
                            <h3 class="text-xl font-black text-slate-900">Ngày ${d}</h3>
                            ${dayBadge}
                        </div>
                        <div class="p-5 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-5">
                `;

                dayVideos.forEach(vid => {
                    const isDone = state.completedVideos.includes(vid.id);
                    const borderCls = isDone ? 'border-brand-400 bg-brand-50/30' : 'border-slate-100 bg-white hover:border-brand-300 hover:shadow-md';
                    const icon = isDone ? '<i class="fa-solid fa-circle-check text-brand-500 text-2xl"></i>' : '<div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-brand-500 group-hover:text-white transition-colors"><i class="fa-solid fa-play text-xs ml-0.5"></i></div>';
                    
                    // Light mode placeholder generator using brand colors
                    const thumbUrl = `https://placehold.co/400x225/ffdcd1/ff4d1b?text=${encodeURIComponent(vid.cover)}`;

                    html += `
                        <div onclick="openVideo(${vid.id})" class="group cursor-pointer border ${borderCls} rounded-2xl p-3 flex gap-4 transition-all duration-300 relative items-center hover:bg-slate-50">
                            
                            <div class="w-28 md:w-36 aspect-video bg-slate-200 rounded-xl overflow-hidden relative shrink-0 shadow-sm">
                                <img src="${thumbUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Thumb">
                                ${isDone ? '<div class="absolute inset-0 bg-brand-500/20 mix-blend-multiply"></div>' : ''}
                            </div>
                            
                            <div class="flex-1 flex flex-col justify-center py-1 pr-2 overflow-hidden">
                                <p class="text-[10px] text-brand-500 font-extrabold mb-1 tracking-widest uppercase">Video ${vid.id < 10 ? '0'+vid.id : vid.id}</p>
                                <h4 class="text-sm md:text-base font-bold text-slate-800 leading-snug mb-1 group-hover:text-brand-600 transition-colors truncate">${vid.title}</h4>
                                <p class="text-[11px] md:text-xs text-slate-500 truncate mt-0.5" title="${vid.muscle}"><i class="fa-solid fa-child-reaching text-brand-400 mr-1"></i> ${vid.muscle}</p>
                                <p class="text-[11px] text-slate-400 truncate italic mt-0.5" title='${vid.tip}'>${vid.tip}</p>
                            </div>
                            
                            <div class="pr-2 shrink-0 flex flex-col items-center gap-1">
                                ${icon}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            html += `</div>`;
            return html;
        }

        // --- STREAMING_CHUNK:Video Modal Controls & Animations... ---
        function animateDashboard() {
            const circle = document.getElementById('progress-circle');
            if(circle) {
                const total = allVideos.length;
                const completed = state.completedVideos.length;
                const percent = Math.round((completed / total) * 100);
                const radius = 60;
                const circumference = 2 * Math.PI * radius;
                const offset = circumference - (percent / 100) * circumference;
                setTimeout(() => { circle.style.strokeDashoffset = offset; }, 50);
            }
        }

        function openVideo(id) {
            const vid = allVideos.find(v => v.id === id);
            if(!vid) return;
            
            state.activeVideoId = id;
            
            // Populate Modal Data
            document.getElementById('modal-day').innerText = `Ngày ${vid.day}`;
            document.getElementById('modal-vid-num').innerText = `Video ${id < 10 ? '0'+id : id}`;
            document.getElementById('modal-title').innerText = vid.title;
            document.getElementById('modal-muscle').innerText = vid.muscle;
            document.getElementById('modal-tip').innerText = vid.tip;
            document.getElementById('modal-content').innerText = vid.content;
            document.getElementById('modal-cta').innerText = vid.cta;
            document.getElementById('modal-check').innerText = vid.check;
            
            // Load real video URL into iframe
            document.getElementById('modal-video-frame').src = vid.videoUrl;

            updateModalButton();

            // Show Modal with animation
            const modal = document.getElementById('video-modal');
            const inner = document.getElementById('modal-inner');
            modal.classList.remove('hidden');
            
            // Allow display block to apply before animating opacity/transform
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                if(window.innerWidth >= 768) {
                    inner.classList.remove('scale-95', 'translate-y-full');
                    inner.classList.add('scale-100', 'translate-y-0');
                } else {
                    inner.classList.remove('translate-y-full');
                    inner.classList.add('translate-y-0');
                }
            });
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const inner = document.getElementById('modal-inner');
            const iframe = document.getElementById('modal-video-frame');
            
            // Start exit animation
            modal.classList.add('opacity-0');
            if(window.innerWidth >= 768) {
                inner.classList.remove('scale-100');
                inner.classList.add('scale-95');
            } else {
                inner.classList.remove('translate-y-0');
                inner.classList.add('translate-y-full');
            }
            
            setTimeout(() => {
                modal.classList.add('hidden');
                iframe.src = ""; // Stop video playback when closing
                
                // Refresh list if needed
                if(state.currentView === 'plan') {
                    document.getElementById('content-area').innerHTML = renderTrainingPlan();
                } else if(state.currentView === 'dashboard') {
                    document.getElementById('content-area').innerHTML = renderDashboard();
                    setTimeout(animateDashboard, 50);
                }
            }, 300);
        }

        function updateModalButton() {
            const btn = document.getElementById('btn-complete');
            const isDone = state.completedVideos.includes(state.activeVideoId);
            
            if(isDone) {
                btn.className = 'w-full py-4 rounded-2xl font-bold transition-all duration-300 flex items-center justify-center gap-2 bg-slate-100 text-slate-500 hover:bg-slate-200 border border-slate-200';
                btn.innerHTML = '<i class="fa-solid fa-rotate-left"></i> Đánh dấu chưa hoàn thành';
            } else {
                btn.className = 'w-full py-4 rounded-2xl font-bold transition-all duration-300 flex items-center justify-center gap-2 bg-brand-500 text-white hover:bg-brand-600 shadow-lg shadow-brand-500/30 hover:scale-[1.02] active:scale-[0.98]';
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Hoàn thành bài tập';
            }
        }

        function toggleCompleteCurrent() {
            const id = state.activeVideoId;
            if(!id) return;
            
            const index = state.completedVideos.indexOf(id);
            let msg = "";
            
            if(index > -1) {
                state.completedVideos.splice(index, 1);
                msg = "Đã bỏ hoàn thành bài tập.";
                showToast(msg, 'info');
            } else {
                state.completedVideos.push(id);
                msg = "Tuyệt vời! Đã hoàn thành bài tập.";
                showToast(msg, 'success');
            }
            
            saveState();
            updateModalButton();
        }

        let toastTimeout;
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'success') {
                icon.className = 'fa-solid fa-circle-check text-brand-400 text-xl';
            } else {
                icon.className = 'fa-solid fa-circle-info text-accent-400 text-xl';
            }
            
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Global Event Listeners
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const modal = document.getElementById('video-modal');
                if(!modal.classList.contains('hidden')) {
                    closeModal();
                }
            }
        });

        // Initialize App
        window.onload = () => {
            loadState();
            navigate('dashboard');
        };
    </script>
