<!DOCTYPE html>

                            bg: '#f8fafc', // Trắng xám nhạt (Light background)
                            card: '#ffffff', // Trắng tinh

                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',

    <style>
        /* Custom Scrollbar for a premium look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .hide-scroll::-webkit-scrollbar { display: none; }

<body class="bg-surface-bg text-slate-800 font-sans antialiased overflow-hidden flex h-screen selection:bg-brand-500 selection:text-white">

                <span>Tổng quan</span>

            <button onclick="navigate('plan')" id="nav-plan" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl text-slate-500 hover:bg-slate-50 hover:text-brand-500 transition-all font-semibold group">

                <span>Lộ trình tập</span>
                <span class="ml-auto bg-brand-100 text-brand-600 text-xs py-0.5 px-2.5 rounded-full font-bold">60</span>
            </button>
            
            <button onclick="navigate('coach')" id="nav-coach" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl text-slate-500 hover:bg-slate-50 hover:text-brand-500 transition-all font-semibold group">

                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-slate-900 truncate">Hương Nguyễn</p>
                    <p class="text-xs text-slate-500 truncate">Master Trainer</p>

            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-50">
        
        <!-- Mobile Header -->
        <header class="md:hidden glass-panel h-16 flex items-center justify-between px-6 z-20 sticky top-0 border-b border-surface-border shadow-sm">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 flex items-center justify-center bg-gradient-to-br from-brand-400 to-brand-600 rounded-lg shadow-sm text-white font-black text-lg italic tracking-tighter">N</div>
                <span class="text-lg font-black tracking-tight text-slate-900">NEXFIT</span>
            </div>
            <img src="https://placehold.co/100x100/f24822/ffffff?text=HN" alt="User" class="w-8 h-8 rounded-full border border-slate-200">
        </header>

        <!-- Dynamic View Container -->
        <div id="view-container" class="flex-1 overflow-y-auto pb-24 md:pb-8 hide-scroll scroll-smooth">

        <div class="flex justify-around items-center p-1 h-16">
            <button onclick="navigate('dashboard')" id="mob-nav-dashboard" class="flex flex-col items-center justify-center gap-1 w-1/3 h-full text-slate-400 transition-colors relative">
                <div class="absolute top-0 w-8 h-1 bg-transparent rounded-b-full transition-colors" id="mob-nav-dashboard-indicator"></div>
                <i class="fa-solid fa-chart-pie text-[22px] mb-0.5"></i>
                <span class="text-[10px] font-bold">Tổng quan</span>
            </button>
            <button onclick="navigate('plan')" id="mob-nav-plan" class="flex flex-col items-center justify-center gap-1 w-1/3 h-full text-slate-400 transition-colors relative">
                <div class="absolute top-0 w-8 h-1 bg-transparent rounded-b-full transition-colors" id="mob-nav-plan-indicator"></div>
                <i class="fa-solid fa-play-circle text-[22px] mb-0.5"></i>
                <span class="text-[10px] font-bold">Lộ trình</span>
            </button>
            <button onclick="navigate('coach')" id="mob-nav-coach" class="flex flex-col items-center justify-center gap-1 w-1/3 h-full text-slate-400 transition-colors relative">
                <div class="absolute top-0 w-8 h-1 bg-transparent rounded-b-full transition-colors" id="mob-nav-coach-indicator"></div>
                <i class="fa-solid fa-chalkboard-user text-[22px] mb-0.5"></i>
                <span class="text-[10px] font-bold">HLV</span>
            </button>
        </div>
    </nav>

    <!-- Video/Web Player Modal -->
    <div id="video-modal" class="fixed inset-0 z-50 hidden opacity-0 transition-all duration-300">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <!-- Modal Content (Website Embed & Details) -->
        <div class="absolute bottom-0 w-full h-[95vh] md:h-[90vh] md:inset-x-8 md:top-1/2 md:-translate-y-1/2 xl:w-[1100px] xl:mx-auto bg-surface-bg md:rounded-3xl rounded-t-3xl shadow-2xl flex flex-col transform translate-y-full md:translate-y-0 md:scale-95 transition-all duration-300 overflow-hidden border border-slate-200" id="modal-inner">
            
            <!-- Header Modal -->
            <div class="w-full bg-white flex justify-between items-center p-4 border-b border-surface-border shrink-0 z-20">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-globe text-lg"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span id="modal-day" class="text-[10px] font-black text-slate-400 uppercase tracking-wider shrink-0">Ngày 1</span>
                            <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                            <span id="modal-vid-num" class="text-[10px] font-black text-brand-500 uppercase tracking-wider shrink-0">Video 01</span>
                        </div>
                        <h2 id="modal-title" class="text-base md:text-lg font-black text-slate-900 truncate max-w-[220px] md:max-w-md">Title Here</h2>
                    </div>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 shrink-0 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-slate-200 hover:text-slate-900 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Scrollable Body: Iframe Web + Details -->
            <div class="flex-1 overflow-y-auto hide-scroll relative bg-slate-50 flex flex-col">
                
                <!-- Webpage Iframe Container -->

                    <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 gap-3 z-0">
                        <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
                        <span class="text-sm font-medium">Đang nhúng website bài tập...</span>
                    </div>
                    <!-- src sẽ được chèn qua JS -->
                    <iframe id="modal-video-frame" class="w-full h-full relative z-10 bg-white" src="" title="Bài tập Nexfit" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>

                <!-- Chi tiết chuyên môn bên dưới -->
                <div class="p-5 md:p-8 shrink-0 bg-white">
                    <div class="flex items-center gap-2 mb-6 border-b border-slate-100 pb-4">
                        <i class="fa-solid fa-file-lines text-brand-500 text-xl"></i>
                        <h3 class="text-xl font-black text-slate-900 tracking-tight">Chi tiết bài tập</h3>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        <!-- Left Column: Muscle & Tip -->
                        <div class="space-y-4 md:space-y-6">
                            <!-- Cơ chính -->
                            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 relative overflow-hidden group">
                                <div class="absolute top-0 right-0 w-24 h-24 bg-brand-50 rounded-bl-full -z-0 opacity-50 group-hover:scale-110 transition-transform"></div>
                                <h4 class="font-bold text-slate-400 text-xs uppercase tracking-wider mb-2 relative z-10 flex items-center gap-2">
                                    <i class="fa-solid fa-child-reaching text-brand-500"></i> Mục tiêu cơ chính
                                </h4>
                                <p id="modal-muscle" class="font-bold text-slate-800 text-sm relative z-10 leading-relaxed"></p>
                            </div>

                            <!-- Tip -->
                            <div class="bg-gradient-to-r from-brand-50 to-white rounded-2xl p-5 border border-brand-100 border-l-4 border-l-brand-500 shadow-sm">
                                <h4 class="font-bold text-brand-700 text-xs uppercase tracking-wider mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-lightbulb text-brand-500"></i> Tip từ HLV
                                </h4>
                                <p id="modal-tip" class="font-semibold text-slate-800 italic text-sm md:text-base leading-relaxed"></p>
                            </div>
                        </div>

                        <!-- Right Column: Content -->
                        <div class="space-y-4 md:space-y-6">
                            <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 h-full">
                                <h4 class="font-bold text-slate-400 text-xs uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <i class="fa-solid fa-person-chalkboard text-slate-500"></i> Hướng dẫn kỹ thuật
                                </h4>
                                <p id="modal-content" class="text-slate-600 text-sm leading-relaxed whitespace-pre-line font-medium"></p>
                            </div>
                        </div>
                    </div>

                    <!-- CTA & Checklist Row -->
                    <div class="mt-4 md:mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-orange-50 rounded-2xl p-4 md:p-5 border border-orange-100 flex items-start gap-3">
                            <div class="w-8 h-8 rounded-full bg-orange-200 text-orange-600 flex items-center justify-center shrink-0 mt-0.5">
                                <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-orange-800 text-xs uppercase tracking-wider mb-1">Checklist Kiểm Tra</h4>
                                <p id="modal-check" class="text-sm font-semibold text-orange-900/80 leading-relaxed"></p>
                            </div>
                        </div>

                        <div class="bg-brand-50 rounded-2xl p-4 md:p-5 border border-brand-100 flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-brand-200 text-brand-600 flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-bullseye text-sm"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-brand-800 text-xs uppercase tracking-wider mb-1">Hành động (CTA)</h4>
                                <p id="modal-cta" class="text-sm font-bold text-brand-900 leading-relaxed"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Action Button -->
            <div class="p-4 bg-white border-t border-surface-border shrink-0">

        </div>
    </div>

        <span id="toast-msg" class="font-bold text-sm tracking-wide">Thành công!</span>
    </div>

    <script>
        // --- 1. DỮ LIỆU BÀI TẬP (60 VIDEOS) ---
        // Sử dụng placeholder website để test iframe nhúng. Ở môi trường thật, thay URL web vào đây.
        const externalWebUrl = "https://example.com"; 

        // Khởi tạo mảng dữ liệu (12 bài đầu tiên chi tiết theo Playbook, 48 bài sau tạo tự động để đủ 60 bài)
        const detailedVideos = [
            // Ngày 1
            { id: 1, day: 1, title: 'Health Bounce: Bài nhập môn', cover: 'NGƯỜI MỚI - HEALTH BOUNCE', muscle: 'Bắp chân, đùi trước, cơ mông; core giữ thân.', tip: '"Mới tập Trampoline? Đừng vội nhảy cao."', content: 'Đặt chân rộng bằng hông, gối mềm. Ép nhẹ hai chân xuống bạt nhưng bàn chân gần như không rời mặt bạt. Giữ mắt nhìn thẳng và người ở giữa.\n\nThực hiện 3 nhịp chậm rồi 4 nhịp đều.', check: 'Không cố bật cao; dừng hoàn toàn trước khi bước xuống.', cta: 'Lưu video này làm bài nhập môn trước buổi đầu.', videoUrl: externalWebUrl },
            { id: 2, day: 1, title: 'Tư thế nền của mọi động tác', cover: 'TƯ THẾ NỀN - 4 ĐIỂM', muscle: 'Chuỗi chân-hông và core ổn định.', tip: '"Tư thế này quyết định gần như cả buổi tập."', content: 'Chân rộng bằng hông, gối mềm, hông lùi nhẹ, ngực mở vừa phải. Không ưỡn lưng và không khóa gối.\n\nLưu ý giữ đường thẳng tai-vai-hông và vòng tròn ở trục gối-mũi chân.', check: 'Cột sống trung lập; vai thả; mắt nhìn trước.', cta: 'Bạn muốn Hương kiểm tra tư thế? Nhắn OFFLINE kèm khu vực.', videoUrl: externalWebUrl },
            // Ngày 2
            { id: 3, day: 2, title: 'Press Down, không Jump Up', cover: 'ÉP XUỐNG, KHÔNG BẬT CAO', muscle: 'Đùi trước, cơ mông, bắp chân; core chống rung.', tip: '"Nhảy càng cao chưa chắc tập càng đúng."', content: 'Trong fitness trampoline, ưu tiên ép bạt và giữ đầu ổn định. \n\nBiên độ thấp giúp kiểm soát nhịp, hông và gối tốt hơn.', check: 'Quay sai/đúng tách biệt; bản đúng dùng biên độ thấp.', cta: 'HLV/chủ phòng muốn nhận checklist kỹ thuật? Nhắn MỞ PHÒNG.', videoUrl: externalWebUrl },
            { id: 4, day: 2, title: 'Cách dừng nảy an toàn', cover: 'DỪNG NẢY - 3 BƯỚC', muscle: 'Đùi trước, đùi sau và core giảm chuyển động.', tip: '"Biết nhảy chưa đủ; phải biết dừng."', content: 'Giảm dần biên độ, mở chân vững, gập gối nhẹ khi chân chạm bạt. \n\nDừng hoàn toàn, lấy lại thăng bằng rồi mới bước xuống.', check: 'Tuyệt đối không nhảy từ bạt thẳng xuống sàn.', cta: 'Lưu video; đây là kỹ năng phải học trước động tác nhanh.', videoUrl: externalWebUrl },
            // Ngày 3
            { id: 5, day: 3, title: 'Vì sao phải ở giữa bạt?', cover: 'GIỮ TÂM BẠT', muscle: 'Cơ ổn định cổ chân, cơ mông bên và core.', tip: '"Bạn cứ trôi ra mép bạt vì thiếu điểm này."', content: 'Nhìn một điểm phía trước, giảm độ cao và ép hai chân cân nhau. \n\nNếu vẫn trôi, trở về Health Bounce thay vì cố tăng tốc.', check: 'Đánh dấu tâm bạt; mắt nhìn một điểm cố định.', cta: 'Bình luận TÂM nếu bạn muốn video thăng bằng.', videoUrl: externalWebUrl },
            { id: 6, day: 3, title: 'Gối đi cùng hướng mũi chân', cover: 'TRỤC GỐI - ĐÚNG/SAI', muscle: 'Đùi trước, cơ mông bên, cơ khép.', tip: '"Gối đổ vào trong? Hạ nhịp ngay."', content: 'Đặt toàn bàn chân, để gối hướng theo mũi chân. Giảm biên độ và giữ hông cân. \n\nChất lượng trục chân quan trọng hơn tốc độ nhạc.', check: 'Bàn chân bám đều; hông cân; không chạy theo nhạc khi mất trục.', cta: 'Nhắn ONLINE nếu bạn cần HLV quan sát tư thế từ xa.', videoUrl: externalWebUrl },
            // Ngày 4
            { id: 7, day: 4, title: 'March cho cơ gập hông', cover: 'CƠ GẬP HÔNG - MARCH', muscle: 'Cơ gập hông, cẳng chân trước; core giữ thân.', tip: '"Muốn nâng gối mà người không ngả sau?"', content: 'Bắt đầu bằng March: ép một chân, nâng chân kia vừa đủ; đổi bên đều. \n\nGiữ xương sườn trên hông, không hất người ra sau.', check: 'Xương sườn ở trên hông; không hất người ra sau.', cta: 'Thử 8 nhịp mỗi bên và bình luận bên khó hơn.', videoUrl: externalWebUrl },

        // --- 3. ĐIỀU HƯỚNG & RENDER UI ---
        function navigate(tab) {
            currentTab = tab;
            
            // Cập nhật giao diện Desktop Nav
            ['dashboard', 'plan', 'coach'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) {
                    if (t === tab) {
                        btn.classList.add('bg-brand-50', 'text-brand-500');
                        btn.classList.remove('text-slate-500', 'hover:bg-slate-50');
                    } else {
                        btn.classList.remove('bg-brand-50', 'text-brand-500');
                        btn.classList.add('text-slate-500', 'hover:bg-slate-50');
                    }
                }
            });

            // Cập nhật giao diện Mobile Nav
            ['dashboard', 'plan', 'coach'].forEach(t => {
                const btn = document.getElementById(`mob-nav-${t}`);
                const indicator = document.getElementById(`mob-nav-${t}-indicator`);
                if(btn && indicator) {
                    if (t === tab) {
                        btn.classList.add('text-brand-500');
                        btn.classList.remove('text-slate-400');
                        indicator.classList.replace('bg-transparent', 'bg-brand-500');
                    } else {
                        btn.classList.remove('text-brand-500');
                        btn.classList.add('text-slate-400');
                        indicator.classList.replace('bg-brand-500', 'bg-transparent');
                    }
                }
            });

            const container = document.getElementById('view-container');
            
            // Xóa nội dung hiện tại với hiệu ứng fade
            container.style.opacity = 0;
            
            setTimeout(() => {
                if (tab === 'dashboard') {
                    container.innerHTML = generateDashboardHTML();
                    renderDashboard(); // Khởi tạo logic dashboard
                } else if (tab === 'plan') {
                    container.innerHTML = generatePlanHTML();
                    renderPlan(); // Khởi tạo logic plan
                } else if (tab === 'coach') {
                    container.innerHTML = generateCoachHTML();
                }
                container.style.opacity = 1;
                window.scrollTo(0,0);
            }, 150);
        }

        function renderDashboard() {
            const total = allVideos.length;
            const completed = completedVideos.length;
            const percent = Math.round((completed / total) * 100);
            
            const circle = document.getElementById('dash-circle');
            const pctText = document.getElementById('dash-percent');
            const compText = document.getElementById('dash-completed');
            
            if(circle && pctText && compText) {
                const circumference = 2 * Math.PI * 40; // r=40
                const offset = circumference - (percent / 100) * circumference;
                
                // Animation delay
                setTimeout(() => {
                    circle.style.strokeDashoffset = offset;
                    pctText.innerText = `${percent}%`;
                    compText.innerText = completed;
                }, 100);
            }
        }

        // --- 5. VIEW GENS: PLAN (LỘ TRÌNH) ---

        // --- 7. MODAL & TƯƠNG TÁC ---
        function openModal(id) {
            currentVideoId = id;
            const video = allVideos.find(v => v.id === id);
            if(!video) return;

            // Fill Content
            document.getElementById('modal-day').innerText = `Ngày ${video.day}`;
            document.getElementById('modal-vid-num').innerText = `Video ${String(video.id).padStart(2,'0')}`;
            document.getElementById('modal-title').innerText = video.title;
            document.getElementById('modal-muscle').innerText = video.muscle;
            document.getElementById('modal-tip').innerText = video.tip;
            document.getElementById('modal-content').innerText = video.content;
            document.getElementById('modal-check').innerText = video.check;
            document.getElementById('modal-cta').innerText = video.cta;
            
            // Set Iframe Src
            document.getElementById('modal-video-frame').src = video.videoUrl;

            updateModalButtonState();

            // UI Animations
            const modal = document.getElementById('video-modal');
            const inner = document.getElementById('modal-inner');
            
            modal.classList.remove('hidden');
            // Trigger reflow
            void modal.offsetWidth; 
            
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            
            inner.classList.remove('translate-y-full', 'scale-95');
            inner.classList.add('translate-y-0', 'scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const inner = document.getElementById('modal-inner');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            
            inner.classList.remove('translate-y-0', 'scale-100');
            inner.classList.add('translate-y-full', 'scale-95');
            
            // Dừng video iframe bằng cách xóa src
            setTimeout(() => {
                document.getElementById('modal-video-frame').src = "";
                modal.classList.add('hidden');
            }, 300);
        }

        function updateModalButtonState() {
            const btn = document.getElementById('btn-complete');
            const isDone = completedVideos.includes(currentVideoId);
            
            if (isDone) {
                btn.innerHTML = `<i class="fa-solid fa-check-circle text-xl"></i> Đã hoàn thành`;
                btn.className = "w-full py-4 rounded-2xl font-black text-emerald-700 bg-emerald-100 transition-all duration-300 flex items-center justify-center gap-2 shadow-sm border border-emerald-200 hover:bg-emerald-200";
            } else {
                btn.innerHTML = `Đánh dấu hoàn thành <i class="fa-solid fa-arrow-right"></i>`;
                btn.className = "w-full py-4 rounded-2xl font-black text-white bg-brand-500 transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:shadow-brand-500/30 hover:bg-brand-600 active:scale-[0.98]";
            }
        }

        function toggleCompleteCurrent() {
            if(!currentVideoId) return;
            
            const idx = completedVideos.indexOf(currentVideoId);
            if (idx > -1) {
                completedVideos.splice(idx, 1);
                showToast("Đã bỏ hoàn thành", false);
            } else {
                completedVideos.push(currentVideoId);
                showToast("Chúc mừng! Đã hoàn thành bài tập.", true);
            }
            
            saveProgress();
            updateModalButtonState();
        }

        // --- 8. TOAST NOTIFICATION ---
        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            
            const icon = document.getElementById('toast-icon');
            if(isSuccess) {
                icon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
                toast.classList.replace('border-slate-700', 'border-emerald-700');
            } else {
                icon.className = "fa-solid fa-rotate-left text-amber-400 text-lg";
                toast.classList.replace('border-emerald-700', 'border-slate-700');
            }

            toast.classList.remove('opacity-0', '-translate-y-24');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-24');
            }, 3000);
        }

        // --- INIT APP ---
        window.onload = () => {
            // Thêm animation tùy chỉnh vào css
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in {
                    animation: fadeIn 0.4s ease-out forwards;
                }
            `;
            document.head.appendChild(style);
            
            // Khởi chạy
            navigate('plan');
        }
    </script>
</body>
</html>
